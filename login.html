<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Infopoços TI</title>
  <link rel="icon" type="image/png" href="logoti.png">

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .logo-container {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px;
      width: 190px;
      margin-bottom: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      transition: 0.3s;
      cursor: pointer;
    }

    .logo-container:hover {
      transform: scale(1.03);
    }

    .logo {
      width: 140px;
      display: block;
      margin: 0 auto;
    }

    .login-box {
      background-color: #ffffff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 300px;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .login-box h2 {
      margin-bottom: 22px;
      color: #0f3d5e;
    }

    input[type="text"], 
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
      font-size: 14px;
    }

    input[type="text"]:focus, 
    input[type="password"]:focus {
      border-color: #0369a1;
    }

    input[type="submit"] {
      background-color: #0f3d5e;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 14px;
    }

    input[type="submit"]:hover {
      background-color: #14507a;
    }

    footer {
      margin-top: 35px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    footer a {
      color: #0369a1;
      font-weight: bold;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <a href="index.html" style="text-decoration: none;">
    <div class="logo-container">
      <img src="logoti.png" alt="Infopoços TI" class="logo">
    </div>
  </a>

  <div class="login-box">
    <h2>Acesso Restrito</h2>

    <form onsubmit="return login()">
      <input type="text" id="usuario" placeholder="Usuário" required />
      <input type="password" id="senha" placeholder="Senha" required />
      <input type="submit" value="Entrar" />
    </form>
  </div>

  <footer>
    © 2025 Infopoços TI – Todos os direitos reservados.<br>
    Desenvolvido por 
    <a href="https://www.infopocos.com.br" target="_blank">
      www.infopocos.com.br
    </a>
  </footer>

  <script src="js/usuarios.js"></script>
  <script>
    function login() {
      const user = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (usuarios[user] && usuarios[user].senha === senha) {
        window.location.href = "acesso.html?user=" + encodeURIComponent(user);
      } else {
        alert("Usuário ou senha inválidos.");
      }

      return false;
    }
  </script>

</body>
</html>
