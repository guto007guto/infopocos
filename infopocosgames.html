<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Infopoços Games – Grupo INFOPOÇOS</title>
<link rel="icon" type="image/png" href="Logogames.png">

<style>
body{
    margin:0;
    padding:0;
    background:#f4f7fb;
    font-family:Arial, sans-serif;
    color:#1f2937;
}

.header{
    text-align:center;
    padding:30px 20px 10px;
}

.header a{
    text-decoration:none;
    color:inherit;
}

.header h1{
    margin:0;
    font-size:32px;
    color:#0f3d5e;
}

.logo-container{
    background:#ffffff;
    border-radius:18px;
    padding:20px;
    width:280px;
    margin:20px auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.3s;
}

.logo-container:hover{
    transform:scale(1.04);
}

.logo{
    width:190px;
    display:block;
    margin:auto;
}

.links-section{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    padding:35px 20px 30px;
}

.card{
    background:#ffffff;
    border-radius:18px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.06);
    transition:0.3s;
    border:1px solid #e5e7eb;
}

.card:hover{
    transform:translateY(-5px);
}

.card a{
    text-decoration:none;
    color:inherit;
}

.card img{
    width:95px;
    height:95px;
    object-fit:contain;
    margin-bottom:12px;
}

.card h3{
    margin:10px 0 8px;
    color:#0f3d5e;
    font-size:20px;
}

.card span{
    color:#6b7280;
    font-size:14px;
}

.whatsapp-container{
    position:fixed;
    right:20px;
    bottom:20px;
    text-align:center;
    z-index:1000;
}

.whatsapp-label{
    background:#0f3d5e;
    color:#fff;
    padding:5px 10px;
    font-size:12px;
    border-radius:8px 8px 0 0;
}

.whatsapp-img{
    width:60px;
    height:60px;
    border-radius:50%;
    box-shadow:0 8px 20px rgba(0,0,0,0.18);
}

footer{
    margin-top:30px;
    text-align:center;
    padding:20px;
    font-size:13px;
    color:#6b7280;
    background:#ffffff;
    border-top:1px solid #e5e7eb;
}

footer a{
    color:#0369a1;
    font-weight:bold;
    text-decoration:none;
}

footer a:hover{
    text-decoration:underline;
}

@media(max-width:900px){
.links-section{
    grid-template-columns:1fr;
}
}

@media(max-width:700px){

.header h1{
    font-size:26px;
}

.logo-container{
    width:240px;
}

.logo{
    width:170px;
}

}
</style>
</head>

<body>

<div class="header">
<a href="index.html">
<h1>Infopoços Games</h1>
</a>
</div>

<div class="logo-container" onclick="window.location.href='index.html'">
<img src="Logogames.png" alt="Infopoços Games" class="logo">
</div>

<section class="links-section">

<div class="card">
<a href="https://chat.whatsapp.com/GASNa8pYl4JGpOVtiZrrPV" target="_blank">
<img src="LogoGrupowhats.png" alt="Grupo WhatsApp">
<h3>👥 Grupo WhatsApp</h3>
<span>Entre no grupo</span>
</a>
</div>

<div class="card">
<a href="https://www.youtube.com/@INFOPOCOSGames" target="_blank">
<img src="LogoYoutube.png" alt="YouTube">
<h3>🎥 Canal YouTube</h3>
<span>Assista nossos vídeos</span>
</a>
</div>

<div class="card">
<a href="https://www.mercadolivre.com.br/pagina/infopocos" target="_blank">
<img src="LogoMercadolivre.png" alt="Mercado Livre">
<h3>🚚 Mercado Livre</h3>
<span>Veja nossas ofertas</span>
</a>
</div>

</section>

<div class="whatsapp-container">
<div class="whatsapp-label">Atendimento</div>
<a href="https://wa.me/5535992598939" target="_blank">
<img src="zap.png" alt="WhatsApp" class="whatsapp-img">
</a>
</div>

<footer>
Contato: infopocosti@gmail.com<br>

Desenvolvido por 
<a href="https://www.infopocos.com.br" target="_blank">
www.infopocos.com.br
</a>
</footer>

</body>
</html>
