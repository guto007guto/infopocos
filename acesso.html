<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel – Infopoços TI</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .logo-container {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px;
      width: 190px;
      margin: 0 auto 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.3s;
    }

    .logo-container:hover {
      transform: scale(1.03);
    }

    .logo {
      width: 140px;
      display: block;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      color: #0f3d5e;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .painel {
      max-width: 950px;
      margin: 20px auto;
      background-color: #ffffff;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }

    .painel h3 {
      color: #0f3d5e;
    }

    .pasta {
      background-color: #f9fafb;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid #e5e7eb;
    }

    .pasta h3 {
      margin: 0 0 10px;
      color: #047857;
      font-size: 18px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li {
      margin: 8px 0;
    }

    li span {
      cursor: pointer;
      color: #0369a1;
      font-weight: bold;
      text-decoration: none;
    }

    li span:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      margin-top: 45px;
      color: #6b7280;
      font-size: 13px;
    }

    footer a {
      color: #0369a1;
      font-weight: bold;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="logo-container" onclick="window.location.href='index.html'">
    <img src="logoti.png" alt="Infopoços TI" class="logo">
  </div>

  <h2>Painel de Acesso</h2>

  <div class="painel" id="conteudo">
    <!-- Conteúdo será inserido via JavaScript -->
  </div>

  <footer>
    © 2025 Infopoços TI – Todos os direitos reservados.<br>
    Desenvolvido por 
    <a href="https://www.infopocos.com.br" target="_blank">
      www.infopocos.com.br
    </a>
  </footer>

  <script src="js/usuarios.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const userParam = params.get("user");
    const conteudo = document.getElementById("conteudo");

    if (userParam) {
      window.history.replaceState({}, document.title, "acesso.html");
    }

    if (!userParam || !usuarios[userParam]) {
      conteudo.innerHTML = "<p>Usuário inválido ou não autenticado.</p>";
    } else {
      const dados = usuarios[userParam];

      if (dados.tipo === "admin") {
        conteudo.innerHTML = `
          <h3>Bem-vindo, administrador!</h3>
          <div>
            <h3>Arquivos por cliente</h3>
            ${Object.entries(usuarios)
              .filter(([k,v]) => v.tipo !== 'admin')
              .map(([k,v]) => `
                <div class="pasta">
                  <h3>Pasta: ${v.pasta}</h3>
                  <ul>
                    ${v.pasta === 'arcoiris' ? `
                      <li><span onclick="window.open('visualizar.html?user=arcoiris', '_blank')">Documentação da Rede (.PDF)</span></li>
                    ` : `
                      <li><span>Nenhum arquivo disponível ainda</span></li>
                    `}
                  </ul>
                </div>
              `).join('')}
          </div>
        `;
      } else {
        const pasta = dados.pasta;
        conteudo.innerHTML = `
          <h3>Bem-vindo, ${userParam}!</h3>
          <div class="pasta">
            <h3>Pasta: ${pasta}</h3>
            <ul>
              ${pasta === 'arcoiris' ? `
                <li><span onclick="window.open('visualizar.html?user=arcoiris', '_blank')">Documentação da Rede (.PDF)</span></li>
              ` : `
                <li><span>Nenhum arquivo disponível ainda</span></li>
              `}
            </ul>
          </div>
        `;
      }
    }
  </script>

</body>
</html>
