<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grupo INFOPOÇOS – Soluções em TI & Games</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      padding: 30px 20px 10px;
      color: #0f3d5e;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding: 30px 40px;
      flex-wrap: wrap;
      gap: 40px;
    }

    .logo-link {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: #1f2937;
      transition: 0.3s;
      border-radius: 18px;
      padding: 25px;
      width: 280px;
      height: 280px;
      background-color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }

    .logo-link:hover {
      transform: scale(1.04);
      box-shadow: 0 14px 35px rgba(0,0,0,0.12);
    }

    .logo-img {
      max-width: 210px;
      max-height: 165px;
      width: auto;
      height: auto;
      background: transparent;
    }

    .system-icon {
      font-size: 85px;
      margin-bottom: 10px;
    }

    .arrow {
      font-size: 16px;
      margin-top: 18px;
      color: #0369a1;
      font-weight: bold;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 18px;
      font-size: 13px;
      color: #6b7280;
      margin-top: auto;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
    }

    footer a {
      color: #0369a1;
      font-weight: bold;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .whatsapp-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      text-align: center;
      z-index: 100;
    }

    .whatsapp-label {
      background-color: #0f3d5e;
      color: #fff;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
    }

    .whatsapp-img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: 0.2s;
    }

    .whatsapp-img:hover {
      transform: scale(1.1);
    }

    @media (max-width: 700px) {
      .title {
        font-size: 25px;
      }

      .container {
        padding: 20px;
        gap: 25px;
      }

      .logo-link {
        width: 240px;
        height: 240px;
      }

      .system-icon {
        font-size: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="title">Grupo INFOPOÇOS</div>
  <div class="subtitle">Soluções em Tecnologia, Segurança Digital e Games</div>

  <div class="container">

    <a class="logo-link" href="infopocosti.html">
      <img src="logoti.png" alt="Logomarca Infopoços TI" class="logo-img" />
      <div class="arrow">Infopoços TI Infraestrutura</div>
    </a>

    <a class="logo-link" href="infopocosgames.html">
      <img src="Logogames.png" alt="Logomarca Infopoços Games" class="logo-img" />
      <div class="arrow">Infopoços Games</div>
    </a>

    <a class="logo-link" href="sistemas.html">
      <div class="system-icon">💻</div>
      <div class="arrow">Desenvolvimento de Sistemas INFOPOÇOS</div>
    </a>

  </div>

  <footer>
    Contato: infopocosti@gmail.com<br>
    © 2025 Grupo INFOPOÇOS – Todos os direitos reservados.<br>
    Desenvolvido por 
    <a href="https://www.infopocos.com.br" target="_blank">
      www.infopocos.com.br
    </a>
  </footer>

  <div class="whatsapp-container">
    <div class="whatsapp-label">Atendimento</div>
    <a href="https://wa.me/5535992598939" target="_blank" title="Fale conosco no WhatsApp">
      <img src="zap.png" alt="WhatsApp" class="whatsapp-img">
    </a>
  </div>

</body>
</html>
```
